# NBA Predictor - Test Configuration
# pytest.ini

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers personalizados
markers =
    critical: Testes críticos que impedem apostas se falharem
    sanity: Testes de sanidade básica do modelo
    integration: Testes de integração de APIs
    slow: Testes que demoram mais de 5s

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignora
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
