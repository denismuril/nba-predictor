# Log rotation configuration for NBA Predictor v16.0
# Place in /etc/logrotate.d/nba-predictor

/path/to/nba-predictor/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 user group
    sharedscripts
    postrotate
        # Optional: restart service if needed
        # systemctl restart nba-predictor
    endscript
}

# Specific log files with different policies

# Cron logs - weekly rotation
/path/to/nba-predictor/logs/cron.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
}

# Monitoring logs - daily with 60 day retention
/path/to/nba-predictor/logs/monitoring_system.log {
    daily
    rotate 60
    compress
    delaycompress
    missingok
    notifempty
    maxsize 100M
}

# API error logs - keep 90 days
/path/to/nba-predictor/logs/api_errors.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    maxsize 50M
}

# Size-based rotation for large logs
/path/to/nba-predictor/logs/debug.log {
    size 100M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
}
