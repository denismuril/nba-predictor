# =============================================================================
# Supervisord Configuration - NBA Predictor
# =============================================================================
# Alternativa ao Docker para gerenciar processos com auto-restart.
# 
# Instalação:
#     sudo apt install supervisor
#     sudo cp supervisord.conf /etc/supervisor/conf.d/nba_predictor.conf
#     sudo supervisorctl reread
#     sudo supervisorctl update
#
# Comandos:
#     sudo supervisorctl status                    # Ver status
#     sudo supervisorctl restart nba-orchestrator  # Reiniciar serviço
#     sudo supervisorctl stop all                  # Parar tudo
# =============================================================================

[program:nba-orchestrator]
command=/home/nba/nba-predictor/venv/bin/python orchestrator.py
directory=/home/nba/nba-predictor
user=nba
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/home/nba/nba-predictor/logs/orchestrator.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    POSTGRES_HOST="127.0.0.1",
    POSTGRES_PORT="5432",
    POSTGRES_USER="nba_admin",
    POSTGRES_DB="nba_predictor_db",
    REDIS_HOST="127.0.0.1",
    REDIS_PORT="6379"

[program:nba-paper-trading]
command=/home/nba/nba-predictor/venv/bin/python betting/paper_trading.py --bankroll 1000 --daemon
directory=/home/nba/nba-predictor
user=nba
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/home/nba/nba-predictor/logs/paper_trading.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    POSTGRES_HOST="127.0.0.1",
    POSTGRES_PORT="5432",
    POSTGRES_USER="nba_admin",
    POSTGRES_DB="nba_predictor_db",
    REDIS_HOST="127.0.0.1",
    REDIS_PORT="6379"

[program:nba-streamlit]
command=/home/nba/nba-predictor/venv/bin/streamlit run nba_predictor_web.py --server.port 8501
directory=/home/nba/nba-predictor
user=nba
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/home/nba/nba-predictor/logs/streamlit.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    POSTGRES_HOST="127.0.0.1",
    POSTGRES_PORT="5432",
    POSTGRES_USER="nba_admin",
    POSTGRES_DB="nba_predictor_db",
    REDIS_HOST="127.0.0.1",
    REDIS_PORT="6379"

# Grupo para gerenciar todos juntos
[group:nba]
programs=nba-orchestrator,nba-paper-trading,nba-streamlit
priority=999
