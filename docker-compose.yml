# =============================================================================
# NBA Predictor v25.0 - Production Docker Compose
# =============================================================================
# Features:
# - Restart policies robustas (sempre reinicia)
# - Health checks para todos os serviços
# - Logging centralizado
# - Rede isolada
# - Volumes persistentes
# =============================================================================

services:
  # =========================================================================
  # PostgreSQL - Banco de dados principal
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: nba-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nba_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nba_predictor_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nba_admin} -d ${POSTGRES_DB:-nba_predictor_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nba-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Redis - Cache de alta velocidade
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: nba-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nba-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Streamlit Web - Dashboard principal
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-web
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nba_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nba_predictor_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ODDS_API_KEY=${ODDS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - nba-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================================================
  # Orchestrator - Pipeline diário (sempre reinicia)
  # =========================================================================
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-orchestrator
    restart: always
    command: python orchestrator.py
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nba_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nba_predictor_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ODDS_API_KEY=${ODDS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SNIPER_ENABLED=${SNIPER_ENABLED:-false}
      - NEWS_FILTER_ENABLED=${NEWS_FILTER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - nba-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # =========================================================================
  # Paper Trading Daemon - Simulação 24/7
  # =========================================================================
  paper-trading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-paper-trading
    restart: always
    command: python betting/paper_trading.py --bankroll 1000 --daemon
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nba_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nba_predictor_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - nba-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================================================
  # Sniper Engine - Monitoramento de odds em tempo real (opcional)
  # =========================================================================
  sniper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-sniper
    restart: always
    command: python betting/sniper_engine.py --mode monitor
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nba_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nba_predictor_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ODDS_API_KEY=${ODDS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - nba-network
    profiles:
      - sniper # Só roda com: docker-compose --profile sniper up
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================================================
  # DB Maintenance - Manutenção semanal (cron dentro do container)
  # =========================================================================
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-maintenance
    restart: "no" # Não reinicia após execução
    command: python scripts/db_maintenance.py --execute
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nba_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nba_predictor_db}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - nba-network
    profiles:
      - maintenance # Só roda com: docker-compose --profile maintenance run maintenance

# =============================================================================
# Networks
# =============================================================================
networks:
  nba-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
