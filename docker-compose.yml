version: '3.8'

services:
  # NBA Predictor Web Interface
  web:
    build: .
    container_name: nba-predictor-web
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./results:/app/results
      - ./monitoring:/app/monitoring
    restart: unless-stopped
    command: streamlit run nba_predictor_web.py --server.port=8501 --server.address=0.0.0.0

  # Daily Prediction Scheduler
  scheduler:
    build: .
    container_name: nba-predictor-scheduler
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./results:/app/results
      - ./monitoring:/app/monitoring
    restart: unless-stopped
    command: >
      sh -c "
      echo '30 12 * * * cd /app && python orchestrator.py >> /app/logs/cron.log 2>&1' | crontab -
      && cron -f
      "

volumes:
  data:
  models:
  logs:
  results:
  monitoring:

networks:
  default:
    name: nba-predictor-network
